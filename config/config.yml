models:
  # Seu modelo principal de Chat (Ex: Llama-3.1-8B-Instruct local)
  - type: main
    engine: openai
    model: meta-llama/Llama-3.1-8B-Instruct
    parameters:
      base_url: "http://localhost:8000/v1"  # Endpoint do seu server local (vLLM/Ollama)
      api_key: "none"

  # Seu modelo focado em Safeguard (Ex: Llama Guard 3 local)
  - type: guard
    engine: openai
    model: meta-llama/Llama-Guard-3-8B
    parameters:
      base_url: "http://localhost:8001/v1"  # Porta dedicada ao modelo de segurança
      api_key: "none"

# Ativação das barreiras de entrada (Input) e saída (Output)
rails:
  input:
    flows:
      - verificar seguranca da entrada
  output:
    flows:
      - verificar seguranca da resposta
