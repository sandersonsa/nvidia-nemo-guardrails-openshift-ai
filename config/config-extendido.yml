models:
  - type: main
    engine: openai
    model: meta-llama/Llama-3.1-8B-Instruct
    parameters:
      base_url: "http://localhost:8000/v1"
      api_key: "none"

  - type: guard
    engine: openai
    model: meta-llama/Llama-Guard-3-8B
    parameters:
      base_url: "http://localhost:8001/v1"
      api_key: "none"

# Ativando os validadores de PII e tópicos
rails:
  input:
    flows:
      - verificar seguranca da entrada
      - verificar dados sensiveis entrada
      - limitar topico do usuario

# Instruções de contexto para o modelo identificar o que é "Fora do Tópico"
instructions:
  - type: general
    content: "Você é um assistente virtual especializado estritamente em atendimento ao cliente e suporte técnico. Não fale sobre outros assuntos."
